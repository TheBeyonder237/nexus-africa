[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-africa"
version = "0.1.0"
description = "Async-first Python SDK for the Nexus/Neero payment gateway (CEMAC zone)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["nexus", "neero", "payment", "mobile-money", "mtn", "orange-money", "cemac", "africa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.urls]
Documentation = "https://docs.nexus-africa.io"
Repository = "https://github.com/TheBeyonder237/nexus-africa"
Issues = "https://github.com/TheBeyonder237/nexus-africa/issues"
Changelog = "https://github.com/TheBeyonder237/nexus-africa/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_africa"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nexus_africa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
